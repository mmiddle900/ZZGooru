<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>슬라임 김희범과 레치타티보</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f5f6fa;font-family:system-ui,"Malgun Gothic",sans-serif;display:flex;justify-content:center;padding:12px}main{width:min(960px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:#202635;border:1px solid #394357;border-radius:12px 12px 0 0}h1{font-size:18px;margin:0}button{background:#344057;color:white;border:1px solid #64718b;border-radius:9px;padding:10px 14px;font:inherit;touch-action:manipulation}button:active{background:#566782}#stage{position:relative;background:#111;overflow:hidden;border:1px solid #394357;border-top:0}canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none}.hud{padding:10px;background:#202635;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.inventory{display:flex;align-items:center;gap:10px;padding:10px;background:#171d29;border:1px solid #394357;border-top:0}.inventory-label{font-size:13px;color:#aeb8ca;font-weight:700}.slots{display:flex;gap:6px}.slot{width:48px;height:48px;padding:3px;border-radius:6px;background:#0e121a;border:2px solid #56627a;display:flex;align-items:center;justify-content:center;position:relative}.slot.empty{border-style:dashed;color:#56627a;font-size:20px}.slot .item-icon{font-size:25px}.slot .item-name{position:absolute;bottom:1px;left:0;right:0;font-size:8px;text-align:center;background:#0009;color:#fff;line-height:12px}.help{color:#aeb8ca;font-size:13px}.dialog{position:absolute;left:3%;right:3%;bottom:3%;background:#111827f2;border:3px solid #d8deea;border-radius:10px;padding:14px;box-shadow:0 4px 0 #0008}.speaker{color:#ffe28a;font-weight:800;margin-bottom:6px}.line{white-space:pre-wrap;line-height:1.6;min-height:48px}.dialog button{margin-top:10px;float:right}.mobile{display:none;justify-content:space-between;align-items:center;gap:12px;padding:12px;background:#202635}.combat-hud{padding:8px 12px;background:#111827;display:flex;gap:12px;align-items:center;font-size:13px}.bar{height:10px;background:#3a2630;border:1px solid #70505b;border-radius:8px;overflow:hidden;flex:1;max-width:180px}.bar span{display:block;height:100%;background:#e65a69;width:100%}.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px}.pad button{padding:0;font-size:20px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}@media(max-width:650px){body{padding:0}.mobile{display:flex}header{border-radius:0}h1{font-size:15px}button{padding:9px 10px}.help{font-size:12px}}
</style></head><body><main><header><h1>김희범과 레치타티보</h1><div><button id="save">저장</button> <button id="reset">처음부터</button></div></header>
<div id="stage"><canvas id="map" width="640" height="416" aria-label="RPG 맵"></canvas><div id="dialog" class="dialog" hidden><div class="speaker" id="speaker"></div><div class="line" id="line"></div><button id="advance">확인 ▶</button></div></div>
<div class="inventory"><span class="inventory-label">인벤토리</span><div class="slots"><div id="slot1" class="slot empty" title="비어 있음">·</div><div id="slot2" class="slot empty" title="비어 있음">·</div><div id="slot3" class="slot empty" title="비어 있음">·</div><div id="slot4" class="slot empty" title="비어 있음">·</div><div id="slot5" class="slot empty" title="비어 있음">·</div></div></div><div class="combat-hud"><span>김희범 HP <b id="hpText">100/100</b></span><div class="bar"><span id="hpBar"></span></div><span id="enemyText">주변을 조사하자</span><span>스테미나 <b id="staminaText">100/100</b></span><div class="bar" style="background:#263b2d;border-color:#55775b"><span id="staminaBar" style="background:#55d68a;width:100%"></span></div></div><div class="hud"><span id="status">김희범(슬라임) · 레치타티보</span><span class="help">이동: 방향키 / WASD · 상호작용: Space 또는 Enter</span></div>
<div class="mobile"><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div style="display:flex;gap:8px"><button id="sprintBtn">달리기</button><button id="action">조사 / 대화</button><button id="attackBtn">검 공격</button></div></div>
</main>
<script>
"use strict";
const canvas=document.getElementById("map"),ctx=canvas.getContext("2d");
const tile=32,cols=100,rows=100,saveKey="zzgooru_rpg_save_v13";
let player={x:12,y:35,hp:100,stamina:100,hasSword:false,map:1,letter:false,rose:false};
let facing={x:0,y:-1},pressed={},last=0,dialogue=false,cutsceneQueue=null,enemy={x:10,y:6,hp:100,alive:false},attackWait=0,enemyWait=0; const item={x:16,y:18},rose={x:23,y:22};
const $=id=>document.getElementById(id);
function pathAt(x,y){
 const pts=[[12,35],[18,29],[20,26],[16,18],[21,19],[23,22],[31,24],[39,29],[47,34],[56,34],[65,30],[75,30],[86,36]];
 const px=x+.5,py=y+.5;
 for(let i=0;i<pts.length-1;i++){
  const [ax,ay]=pts[i],[bx,by]=pts[i+1],vx=bx-ax,vy=by-ay;
  const t=Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/(vx*vx+vy*vy)));
  if(Math.hypot(px-(ax+t*vx),py-(ay+t*vy))<1.35)return true;
 }
 return false;
}
function treeCandidate(x,y){
 const ix=Math.floor(x),iy=Math.floor(y),h=(ix*73856093^iy*19349663)>>>0;
 if(pathAt(ix,iy)||Math.hypot(ix-item.x,iy-item.y)<3||Math.hypot(ix-rose.x,iy-rose.y)<3||Math.hypot(ix-12,iy-35)<2.5)return false;
 if(ix>=64&&ix<=76&&iy>=27&&iy<=34)return false;
 return h%11<3;
}
// Create the forest once. Drawing and collision both use this same fixed set.
const treeTiles=new Set();
for(let ty=0;ty<rows;ty++)for(let tx=0;tx<cols;tx++)if(treeCandidate(tx,ty))treeTiles.add(tx+","+ty);
function treeAt(x,y){return treeTiles.has(Math.floor(x)+","+Math.floor(y));}
function tileBlocked(x,y){
 if(x<1||y<1||x>=cols-1||y>=rows-1)return true;
 if((x>=65&&x<=69&&y>=28&&y<=31)||(x>=70&&x<=73&&y>=29&&y<=32))return true;
 return false;
}
// 플레이어는 원형, 나무는 그림 전체 타일이 아니라 보이는 줄기 중심에 충돌을 둔다.
const playerRadius=.34,treeTrunkRadius=.13;
function pass(cx,cy){
 if(!Number.isFinite(cx)||!Number.isFinite(cy))return false;
 // player.x/y are tile coordinates; the sprite center is at tile + 0.5.
 const wx=cx+.5,wy=cy+.5,r=playerRadius,r2=r*r;
 const minX=Math.floor(wx-r),maxX=Math.floor(wx+r);
 const minY=Math.floor(wy-r),maxY=Math.floor(wy+r);
 // Tile obstacles (world border and pond): circle vs tile rectangle.
 for(let ty=minY;ty<=maxY;ty++)for(let tx=minX;tx<=maxX;tx++){
  if(!tileBlocked(tx,ty))continue;
  const qx=Math.max(tx,Math.min(wx,tx+1)),qy=Math.max(ty,Math.min(wy,ty+1));
  const ox=wx-qx,oy=wy-qy;
  if(ox*ox+oy*oy<r2-1e-9)return false;
 }
 // Tree trunks use the exact rectangle drawn in render().
 const trunkLeft=13/32,trunkTop=18/32,trunkW=7/32,trunkH=12/32;
 const minTX=Math.floor(wx-r)-1,maxTX=Math.floor(wx+r)+1;
 const minTY=Math.floor(wy-r)-1,maxTY=Math.floor(wy+r)+1;
 for(let ty=minTY;ty<=maxTY;ty++)for(let tx=minTX;tx<=maxTX;tx++){
  if(!treeAt(tx,ty))continue;
  const left=tx+trunkLeft,top=ty+trunkTop;
  const qx=Math.max(left,Math.min(wx,left+trunkW));
  const qy=Math.max(top,Math.min(wy,top+trunkH));
  const ox=wx-qx,oy=wy-qy;
  if(ox*ox+oy*oy<r2-1e-9)return false;
 }
 return true;
}
function talk(s,speaker="나레이션"){pressed={};dialogue=true;$("dialog").hidden=false;$("speaker").textContent=speaker;$("line").textContent=s;}
function playIntro(){
 cutsceneQueue=[
  ["김희범","아 씨발... 여기가 어디야"],
  ["나레이션","김희범은 주변을 둘러본다"],
  ["김희범","너거매... 난 분명 헨리랑 $$ 하고 있었는데..."],
  ["나레이션","주변을 조사하자"]
 ];
 advanceCutscene();
}
function advanceCutscene(){
 if(cutsceneQueue&&cutsceneQueue.length){const line=cutsceneQueue.shift();talk(line[1],line[0]);}
 else{cutsceneQueue=null;dialogue=false;$("dialog").hidden=true;save();}
}
function closeTalk(){if(cutsceneQueue){advanceCutscene();return;}dialogue=false;$("dialog").hidden=true;save();}
function save(){try{localStorage.setItem(saveKey,JSON.stringify({player,enemy}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(saveKey)||"null");if(d&&d.player){player=Object.assign(player,d.player);if(d.enemy)enemy=d.enemy;}}catch(e){}}
function interact(){
 if(dialogue){closeTalk();return;}
 const dItem=Math.hypot(player.x-item.x,player.y-item.y),dRose=Math.hypot(player.x-rose.x,player.y-rose.y);
 if(!player.hasSword&&dItem<2.2){
  player.hasSword=true;
  cutsceneQueue=[
   ["김희범","오 이건 헨리랑 원나잇 대가로 얻은 레치타티보? ㅅㅅ"],
   ["나레이션","레치타티보를 주웠습니다."]
  ];
  advanceCutscene();
  $("status").textContent="(레치타티보를 획득하였씁니다.)";
  return;
 }
 if(!player.rose&&dRose<2.2){
  player.rose=true;
  cutsceneQueue=[
   ["로즈 페르디난트","(피를 흘리고 쓰러져있다)"],
   ["김희범","오 이런 미친"],
   ["나레이션","(로즈 페르디난트를 동료로 얻었다)"]
  ];
  advanceCutscene();
  $("status").textContent="(로즈 페르디난트 동료 추가)";
  return;
 }
 save();render();
}
function attack(){
 if(dialogue||!player.hasSword||attackWait>0)return;
 attackWait=.35;
 if(player.map===1&&enemy.alive){
  const dx=enemy.x-player.x,dy=enemy.y-player.y,d=Math.hypot(dx,dy)||1;
  if(d<1.55&&(dx*facing.x+dy*facing.y)/d>.1){enemy.hp=Math.max(0,enemy.hp-35);if(enemy.hp===0)enemy.alive=false;}
 }
 render();
}
let audioCtx=null,footNoise=null,stepTimer=0;
function unlockAudio(){
 try{
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();const n=Math.floor(audioCtx.sampleRate*.22);footNoise=audioCtx.createBuffer(1,n,audioCtx.sampleRate);const data=footNoise.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(.7*(1-i/n));}
  if(audioCtx.state==="suspended")audioCtx.resume();
 }catch(e){}
}
function groundType(x,y){
 if(pathAt(x,y))return "path";
 let nearbyTrees=0;for(let ty=Math.floor(y)-1;ty<=Math.floor(y)+1;ty++)for(let tx=Math.floor(x)-1;tx<=Math.floor(x)+1;tx++)if(treeAt(tx,ty))nearbyTrees++;
 return nearbyTrees>=3?"forest":"grass";
}
function playFootstep(type,running){
 if(!audioCtx||audioCtx.state!=="running"||!footNoise)return;
 const now=audioCtx.currentTime;
 const src=audioCtx.createBufferSource();src.buffer=footNoise;
 const filter=audioCtx.createBiquadFilter();filter.type="lowpass";
 filter.frequency=type==="path"?(running?1500:1100):type==="forest"?900:1300;
 const gain=audioCtx.createGain();
 gain.gain.setValueAtTime(type==="grass"?.035:type==="forest"?.055:.045,now);
 gain.gain.exponentialRampToValueAtTime(.001,now+.11);
 src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);
 src.start(now);src.stop(now+.12);
 if(type==="path"){
  const osc=audioCtx.createOscillator(),og=audioCtx.createGain();osc.type="sine";osc.frequency.setValueAtTime(running?105:82,now);osc.frequency.exponentialRampToValueAtTime(45,now+.07);
  og.gain.setValueAtTime(.035,now);og.gain.exponentialRampToValueAtTime(.001,now+.08);osc.connect(og);og.connect(audioCtx.destination);osc.start(now);osc.stop(now+.09);
 }
}
function update(dt){
 if(dialogue)return;
 attackWait=Math.max(0,attackWait-dt);enemyWait=Math.max(0,enemyWait-dt);
 let dx=(pressed.right?1:0)-(pressed.left?1:0),dy=(pressed.down?1:0)-(pressed.up?1:0);
 const moving=!!(dx||dy);
 const sprinting=moving&&pressed.run&&player.stamina>0;
 if(moving){
  stepTimer-=dt;
  if(stepTimer<=0){
   playFootstep(groundType(player.x,player.y),sprinting);
   stepTimer=sprinting ? 0.30 : 0.43;
  }
 }else stepTimer=0;
 if(sprinting)player.stamina=Math.max(0,player.stamina-5*dt);
 else player.stamina=Math.min(100,player.stamina+(moving?1:2)*dt);
 if(moving){
  const l=Math.hypot(dx,dy);dx/=l;dy/=l;facing={x:dx,y:dy};
  const speed=3.2*(sprinting?1.5:1);
  // 작은 단계로 나눠 이동해 벽/나무를 통과하는 현상 방지, 축별 판정으로 벽을 따라 이동 가능
  const distance=speed*dt,steps=Math.max(1,Math.ceil(distance/.04)),stepX=dx*distance/steps,stepY=dy*distance/steps;
  for(let i=0;i<steps;i++){
   if(pass(player.x+stepX,player.y))player.x+=stepX;
   if(pass(player.x,player.y+stepY))player.y+=stepY;
  }
 }
}
function obj(x,y,s,color){ctx.fillStyle=color;ctx.font="25px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(s,x*tile+16,y*tile+16);ctx.textAlign="left";ctx.textBaseline="alphabetic";}
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const worldW=cols*tile,worldH=rows*tile;
 const camX=Math.max(0,Math.min(worldW-canvas.width,player.x*tile+tile/2-canvas.width/2));
 const camY=Math.max(0,Math.min(worldH-canvas.height,player.y*tile+tile/2-canvas.height/2));
 const sx=Math.floor(camX/tile),sy=Math.floor(camY/tile);
 const ex=Math.min(cols,Math.ceil((camX+canvas.width)/tile)+1),ey=Math.min(rows,Math.ceil((camY+canvas.height)/tile)+1);
 ctx.fillStyle="#17251d";ctx.fillRect(0,0,canvas.width,canvas.height);
 for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){
  const px=x*tile-camX,py=y*tile-camY,edge=x<2||y<2||x>=cols-2||y>=rows-2;
  const h=((x*31+y*17+x*y*7)>>>0)%9;
  ctx.fillStyle=edge?"#34463a":(pathAt(x,y)?"#c8b58a":(h<2?"#6d995b":"#79a766"));
  ctx.fillRect(px,py,tile,tile);
  if(!edge&&!pathAt(x,y)&&h===0){ctx.fillStyle="#8dbb72";ctx.fillRect(px+5,py+7,3,3);ctx.fillRect(px+22,py+20,2,3);}
  if(treeAt(x,y)){
   ctx.fillStyle="#4c6741";ctx.fillRect(px+13,py+18,7,12);
   ctx.fillStyle="#2e5737";ctx.beginPath();ctx.arc(px+16,py+13,13,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#477a46";ctx.beginPath();ctx.arc(px+11,py+10,8,0,Math.PI*2);ctx.arc(px+21,py+9,8,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#699653";ctx.beginPath();ctx.arc(px+15,py+6,6,0,Math.PI*2);ctx.fill();
  }
  if((x>=65&&x<=69&&y>=28&&y<=31)||(x>=70&&x<=73&&y>=29&&y<=32)){
   ctx.fillStyle="#6c9db0";ctx.fillRect(px,py,tile,tile);ctx.fillStyle="#9fc7d0";ctx.fillRect(px+5,py+8,15,2);
  }
 }
 // 지도 경계: 굵은 돌담/나무 울타리로 월드 끝을 명확히 표시
 ctx.strokeStyle="#27352b";ctx.lineWidth=12;ctx.strokeRect(tile-camX,tile-camY,worldW-2*tile,worldH-2*tile);
 // item and companion use normal screen-space sizes (not world-scaled)
 const ix=item.x*tile+tile/2-camX,iy=item.y*tile+tile/2-camY;
 if(!player.hasSword){
  ctx.save();ctx.translate(ix,iy);ctx.rotate(-.45);ctx.fillStyle="#aeb5c0";ctx.fillRect(-2,-10,4,20);ctx.fillStyle="#e4c66c";ctx.fillRect(-7,-2,14,4);ctx.restore();
  ctx.fillStyle="#253329";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText("레치타티보",ix,iy-17);
 }
 const rx=rose.x*tile+tile/2-camX,ry=rose.y*tile+tile/2-camY;
 if(!player.rose){
  ctx.fillStyle="#3b4c70";ctx.beginPath();ctx.ellipse(rx,ry+3,10,6,-.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#d7b3a5";ctx.beginPath();ctx.arc(rx+7,ry-2,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#b34d59";ctx.beginPath();ctx.ellipse(rx-2,ry+1,4,7,.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#263329";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText("로즈 페르디난트",rx,ry-17);
 }
 const px=player.x*tile+tile/2-camX,py=player.y*tile+tile/2-camY;
 // 김희범: 일정한 22px 슬라임 크기, 카메라 줌과 무관
 ctx.fillStyle="#0003";ctx.beginPath();ctx.ellipse(px,py+9,11,4,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#42d9a0";ctx.beginPath();ctx.ellipse(px,py,11,12,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#1b9b78";ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle="#123f37";ctx.fillRect(px-4,py-2,2,2);ctx.fillRect(px+4,py-2,2,2);
 if(player.hasSword){ctx.strokeStyle="#e7eaf2";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+facing.x*9,py+facing.y*9);ctx.lineTo(px+facing.x*19,py+facing.y*19);ctx.stroke();}
 ctx.textAlign="left";
 $("hpText").textContent=player.hp+"/100";$("hpBar").style.width=player.hp+"%";$("staminaText").textContent=Math.floor(player.stamina)+"/100";$("staminaBar").style.width=player.stamina+"%";
 $("enemyText").textContent=player.rose?"동료: 로즈 페르디난트":"주변을 조사하자";
 const slot=$("slot1");if(player.hasSword){slot.className="slot";slot.innerHTML='<span class="item-icon">⚔️</span><span class="item-name">레치타티보</span>';}else{slot.className="slot empty";slot.textContent="·";}
 const slot2=$("slot2");if(player.rose){slot2.className="slot";slot2.innerHTML='<span class="item-icon">🔵</span><span class="item-name">로즈</span>';}else{slot2.className="slot empty";slot2.textContent="·";}
}
function dir(e){
 const code=e.code||"",key=(e.key||"").toLowerCase();
 return ({ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right"})[code]||({w:"up",s:"down",a:"left",d:"right"})[key];
}
function clearInput(){pressed={};}
document.addEventListener("keydown",e=>{
 unlockAudio();
 const d=dir(e);
 const action=e.code==="Space"||e.code==="Enter"||e.key===" ";
 const attackKey=["KeyZ","KeyJ"].includes(e.code)||["z","j"].includes((e.key||"").toLowerCase());
 if(d||e.code==="ShiftLeft"||e.code==="ShiftRight"||action||attackKey)e.preventDefault();
 if(e.repeat)return;
 if(dialogue){if(action||e.code==="Enter")closeTalk();return;}
 if(d)pressed[d]=true;
 if(e.code==="ShiftLeft"||e.code==="ShiftRight")pressed.run=true;
 if(action)interact();
 if(attackKey)attack();
});
document.addEventListener("keyup",e=>{
 const d=dir(e);if(d)pressed[d]=false;
 if(e.code==="ShiftLeft"||e.code==="ShiftRight")pressed.run=false;
});
window.addEventListener("blur",clearInput);
document.addEventListener("visibilitychange",()=>{if(document.hidden)clearInput();});
document.querySelectorAll("[data-dir]").forEach(b=>{
 const d=b.dataset.dir;
 b.addEventListener("pointerdown",e=>{unlockAudio();e.preventDefault();b.setPointerCapture?.(e.pointerId);pressed[d]=true;});
 const release=e=>{pressed[d]=false;};
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,release));
});
const sprintBtn=$("sprintBtn");
sprintBtn.addEventListener("pointerdown",e=>{unlockAudio();e.preventDefault();sprintBtn.setPointerCapture?.(e.pointerId);pressed.run=true;});
